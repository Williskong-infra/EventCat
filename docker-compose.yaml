version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eventcat
      MYSQL_USER: eventcat
      MYSQL_PASSWORD: eventcatpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql://eventcat:eventcatpassword@db:3306/eventcat
      STRIPE_SECRET_KEY: sk_test_xxx # <-- Replace with your real key or use .env
    depends_on:
      - db
    ports:
      - "3001:3001"
    volumes:
      - ./backend/media:/app/media

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: 